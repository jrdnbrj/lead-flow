services:
  leadflow:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-local}
      x-bake:
        timeout: "600s"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NPM_CONFIG_LOGLEVEL: verbose
      # Local Docker must never connect to an Evolution runtime. WhatsApp
      # remains a production-only capability to protect the live sessions.
      EVOLUTION_API_URL: ""
      EVOLUTION_API_KEY: ""
      EVOLUTION_API_INSTANCE_NAME: ""
      EVOLUTION_WEBHOOK_URL: ""
      EVOLUTION_WEBHOOK_TOKEN: ""
      WHATSAPP_REMINDER_ENABLED: "false"
      WHATSAPP_REMINDER_EVOLUTION_INSTANCE: ""
      WHATSAPP_REMINDER_RECIPIENT: ""
      WHATSAPP_REMINDER_DISPATCH_SECRET: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
