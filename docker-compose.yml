services:
  leadflow:
    build:
      context: .
      dockerfile: Dockerfile
      x-bake:
        timeout: "600s"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NPM_CONFIG_LOGLEVEL: verbose
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
