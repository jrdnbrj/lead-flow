name: LeadFlow production deploy

on:
  workflow_run:
    workflows: ["LeadFlow CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to deploy; defaults to the triggering main commit"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: leadflow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      DEPLOY_COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout deployment metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_COMMIT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable LeadFlow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jrdnbrj/lead-flow:${{ env.DEPLOY_COMMIT }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_COMMIT }}

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/leadflow_deploy_key"
          known_hosts_file="$RUNNER_TEMP/leadflow_known_hosts"
          umask 077
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          printf 'KEY_FILE=%s\nKNOWN_HOSTS_FILE=%s\n' "$key_file" "$known_hosts_file" >> "$GITHUB_ENV"

      - name: Deploy selected commit
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$KEY_FILE" \
            -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && DEPLOY_COMMIT='$DEPLOY_COMMIT' ./scripts/deploy-production.sh"
